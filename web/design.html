<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rocket in Cloud</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body class="design-page">
  <header class="sbar">
    <a class="btn ghost icon" href="/" title="All designs" aria-label="All designs" id="back"></a>
    <img class="logo" src="/logo.png" alt="">
    <span class="title" id="title">Loading…</span>
    <span class="badge" id="role-badge" hidden>View only</span>
    <span class="pill wait" id="status">Starting</span>
    <span class="activity" id="activity" aria-live="polite"></span>
    <span class="spacer"></span>
    <span class="people" id="people" title="Who's here" role="button" tabindex="0"></span>
    <button class="ghost" id="share-btn" hidden></button>
    <button class="ghost icon hide-sm" id="history-btn" title="Edit history" aria-label="Edit history"></button>
    <button class="ghost icon hide-sm" id="download-btn" title="Download .ork" aria-label="Download .ork"></button>
    <button class="ghost icon hide-sm" id="fullscreen-btn" title="Full screen" aria-label="Full screen"></button>
  </header>
  <div class="popover" id="popover" hidden></div>
  <div id="screen"></div>
  <div class="overlay" id="overlay">
    <div class="box" id="overlay-box"></div>
  </div>
  <script type="module" src="/src/design.js"></script>
</body>
</html>
